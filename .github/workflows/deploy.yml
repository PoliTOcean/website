name: Aggiornamento Automatico Sito

on:
  push:
    branches:
      - master

# Deploy in coda: due push ravvicinati non si sovrappongono sul server.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Esecuzione comandi sul server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/politocean.polito.it
            git fetch origin
            git reset --hard origin/master
            npm install
            npm run build
            pm2 reload politocean-web